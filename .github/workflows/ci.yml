name: ci

# The project only builds on Termux or Android, since it needs bionic, libandroid and the
# SurfaceFlinger Binder ABI, so the Linux runners cannot compile it. CI therefore covers
# what can be proven without an Android environment: structural invariants, protocol
# generation, and a cross build against the Termux headers bundled in deps/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: structure and protocol generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install wayland-scanner and wayland-protocols
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-bin wayland-protocols
          command -v wayland-scanner
          ls /usr/share/wayland-protocols/stable | head -3

      - name: structure check and protocol generation
        run: python3 tools/check_structure.py --protogen --show-order

  cross:
    name: cross build with a custom NDK and the Termux headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache the NDK
        uses: actions/cache@v4
        with:
          path: ~/ndk-cache
          key: ndk-custom-r30-x86_64-linux-gnu

      - name: fetch the NDK (android-ndk-custom r30, x86_64-linux-gnu host)
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/ndk-cache/ndk" ]; then
            mkdir -p "$HOME/ndk-cache"
            curl -fL --retry 3 -o /tmp/ndk.tar.xz \
              https://github.com/HomuHomu833/android-ndk-custom/releases/download/r30/android-ndk-r30-x86_64-linux-gnu.tar.xz
            mkdir -p /tmp/ndk-extract
            tar -xJf /tmp/ndk.tar.xz -C /tmp/ndk-extract
            inner=$(find /tmp/ndk-extract -maxdepth 1 -mindepth 1 -type d | head -1)
            mv "$inner" "$HOME/ndk-cache/ndk"
          fi
          ls "$HOME/ndk-cache/ndk"
          echo "NDK=$HOME/ndk-cache/ndk" >> "$GITHUB_ENV"

      - name: install wayland-scanner, wayland-protocols and xz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwayland-bin wayland-protocols xz-utils

      - name: unpack the Termux dependencies bundled with the repository
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps"
          tar -xJf deps/termux-deps-aarch64.tar.xz -C "$RUNNER_TEMP/deps"
          ls -l "$RUNNER_TEMP/deps/include/wayland-server-core.h" \
                "$RUNNER_TEMP/deps/lib/libwayland-server.so"

      - name: cross build
        run: |
          NDK="$NDK" DEPS="$RUNNER_TEMP/deps" OUT="$RUNNER_TEMP/out" \
            sh build-aux/ci-cross-build.sh
          ls -l "$RUNNER_TEMP/out/sfwm"
